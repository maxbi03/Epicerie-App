# Config Nginx pour le déploiement (laptop Windows / VPS Infomaniak).
# Sert /uploads/ directement en fichier statique (sans passer par Next.js/Node,
# beaucoup plus rapide), et proxifie tout le reste vers l'app Next.js.
#
# Rôle : reverse-proxy + terminaison TLS. Nécessaire pour HTTPS (géolocalisation,
# caméra, webhooks Mollie) — voir CLAUDE.md.
#
# À adapter avant usage :
#   - server_name : ton nom de domaine réel
#   - ssl_certificate / ssl_certificate_key : chemins réels (ex. Let's Encrypt / Certbot)
#   - alias dans /uploads/ : chemin absolu réel vers le dossier uploads/ du projet
#   - proxy_pass : http://localhost:3000 si l'app tourne en process natif/pm2/systemd,
#     ou http://app:3000 si l'app est elle-même un service dans docker-compose

server {
    listen 80;
    server_name TON_DOMAINE.ch;
    # Redirection HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name TON_DOMAINE.ch;

    ssl_certificate     /etc/letsencrypt/live/TON_DOMAINE.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TON_DOMAINE.ch/privkey.pem;

    # Autorise les uploads (avatars 2 Mo max, images produits 8 Mo max côté app)
    client_max_body_size 10m;

    # ── Fichiers uploadés : servis en statique, sans passer par Next.js ──
    # Avatars : cache court (nom de fichier stable, réécrit à chaque changement)
    location /uploads/avatars/ {
        alias /CHEMIN/ABSOLU/VERS/Epicerie-App/uploads/avatars/;
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Images produits : cache long + immutable (nom de fichier = UUID, jamais réécrit)
    location /uploads/products/ {
        alias /CHEMIN/ABSOLU/VERS/Epicerie-App/uploads/products/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Tout le reste : proxifié vers l'app Next.js ──
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
